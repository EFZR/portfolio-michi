# Despliegue de la web. Antes del monorepo esto vivía en los ajustes del sitio
# en Netlify; ahora vive aquí porque las rutas cambiaron y un archivo en el
# repo se revisa en el pull request — un ajuste en un panel web, no.
#
# OJO AL MIGRAR: un `netlify.toml` GANA sobre lo configurado en la interfaz.

[build]
  # SIN `base`, o sea la raíz del repo. Es el arreglo: con `base = "apps/web"`
  # Netlify hacía `cd apps/web` y corría ahí SU PROPIO `npm install` antes de
  # ejecutar el comando de abajo. En esa carpeta no hay lockfile y la
  # dependencia `"@princess/content": "*"` no existe en el registro público, así
  # que la instalación fallaba antes de llegar a nuestra línea.
  #
  # Desde la raíz, npm encuentra el `package-lock.json` y los workspaces, enlaza
  # `@princess/content` localmente y `npm run build` delega en `apps/web`.
  publish = "apps/web/dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

  # ── ESCÁNER DE SECRETOS ────────────────────────────────────────────────────
  # Netlify tumba el build si encuentra el valor de una variable de entorno en
  # el repo o en la salida. Con estas seis eso es inevitable Y correcto: el
  # prefijo `VITE_` significa exactamente «esto viaja al navegador», así que
  # TODAS acaban en texto plano dentro del bundle. No son credenciales —
  # identifican el proyecto— y lo que protege los datos son las reglas de
  # seguridad (ver .env.example).
  #
  # Además, `VITE_FIREBASE_PROJECT_ID` coincide con el nombre del sitio en
  # Netlify, que aparece en el endpoint del actualizador del panel
  # (`src-tauri/tauri.conf.json`). Esa URL no se puede quitar: es dónde el
  # panel busca sus actualizaciones.
  #
  # Se omiten LAS CLAVES, no el escáner entero: `SECRETS_SCAN_ENABLED = false`
  # habría sido una línea menos y dejaría de avisar el día que se filtre algo
  # que sí es un secreto —una clave de servicio, el build hook—. Eso no se toca.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"

# VARIABLES QUE HAY QUE CONFIGURAR EN NETLIFY
# (Site configuration → Environment variables), porque el `prebuild` baja el
# contenido de Firestore y aquí no hay archivo `.env`:
#
#   VITE_FIREBASE_API_KEY              VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_AUTH_DOMAIN          VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_PROJECT_ID           VITE_FIREBASE_APP_ID
#
# No son secretas: viajan en el bundle igual (ver .env.example). Si faltan, el
# build falla a propósito y dice cuáles — un despliegue silencioso con el
# contenido de la semana pasada vacía de sentido el botón «Publicar» del panel.

# El SPA fallback sigue viniendo de `apps/web/public/_redirects`
# (`/* /index.html 200`), que Vite copia a `dist/`. Se deja ahí y no aquí para
# no partir la configuración de rutas en dos sitios.
