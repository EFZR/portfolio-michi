[package]
name = "princess-admin"
version = "0.1.0"
description = "Panel administrativo de my Princess"
edition = "2021"

[lib]
name = "princess_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Subida a Storage desde Rust. NO es una dependencia nueva de verdad: ya está
# en el árbol porque la arrastra tauri-plugin-updater. Con rustls para no
# depender de OpenSSL del sistema.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha256 del original: lo exige el esquema (`source.sha256`) y es lo que
# sostiene la idempotencia — reconocer que este archivo ya se procesó.
sha2 = "0.10"
# El LQIP se guarda como data URI dentro del registro (R3/placeholder).
base64 = "0.22"
# Marcas de tiempo ISO 8601 para el registro. A mano habría que escribir un
# calendario (años bisiestos incluidos) y no vale la pena el riesgo.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
