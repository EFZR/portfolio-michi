[package]
name = "princess-admin"
version = "0.1.0"
description = "Panel administrativo de my Princess"
edition = "2021"

[lib]
name = "princess_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
