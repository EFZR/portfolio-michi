<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Google Fonts:
        - Anton          (display heavy condensed, solo Hero)
        - Fraunces       (serif decorativa, palabra "así" y otros highlights)
        - Space Grotesk  (sans-body global)
        - JetBrains Mono (code/badges)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,300..900&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Princess Portfolio</title>
  </head>
  <body>
    <!--
      COPIA ESTÁTICA DEL FORMULARIO DE CONTACTO — no se ve, no se usa.

      Netlify detecta formularios rastreando el HTML PUBLICADO. Como esta web es
      una SPA y el formulario real lo pinta Vue en tiempo de ejecución, el
      rastreador no encontraría nada y los envíos se perderían en silencio.
      Esta copia existe solo para que lo encuentre en el build.

      Los `name` deben coincidir EXACTAMENTE con los del formulario de Vue
      (`src/components/contact/ContactForm.vue`) y con los que arma
      `src/lib/contacto.ts`. Si añades un campo allí, añádelo aquí.
    -->
    <form name="contacto" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <input type="text" name="oficio" />
      <textarea name="mensaje"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
